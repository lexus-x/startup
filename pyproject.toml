[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksam"
version = "0.1.0"
description = "Kinematic Singularity Awareness Module for Vision-Language-Action Models"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Lexus-X Team", email = "team@lexus-x.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
eval = [
    "gymnasium>=0.28.0",
    "metaworld>=1.0.0",
    "octo>=0.1.0",
    "matplotlib>=3.7.0",
    "tensorboard>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/lexus-x/startup"
Repository = "https://github.com/lexus-x/startup.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
